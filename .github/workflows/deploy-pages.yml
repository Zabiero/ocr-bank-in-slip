name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/adoring-bardeen-jhmjkx
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        # Vite inlines VITE_* env vars into the built JS at build time, so
        # they must come from repo secrets here, not a runtime config. Both
        # are optional - if unset, the app builds fine and the central
        # record-keeping feature (see README.md) just stays off.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Auto-creates the Pages site (build type "workflow") if this repo
          # doesn't have one yet, instead of requiring a manual one-time
          # toggle in Settings -> Pages.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
